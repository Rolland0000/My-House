name: CI Backend

on:
  pull_request:
    branches: ["develop"]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend_fmt:
    name: Backend Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  backend_clippy:
    name: Backend Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  backend_deny:
    name: Backend Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: backend/Cargo.toml

  backend_audit:
    name: Backend Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Cache cargo-audit
        id: cache-cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-v1
      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
        working-directory: backend

  backend_build:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo build
        run: cargo build --verbose

  backend_doc:
    name: Backend Documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: cargo doc
        run: cargo doc --no-deps --verbose

  backend_unit_tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [backend_build]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Cache cargo-llvm-cov
        id: cache-llvm-cov
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-cargo-llvm-cov-v1
      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked
      - name: Cache cargo-nextest
        id: cache-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-v1
      - name: Install cargo-nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --locked
      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace
      - name: Run unit tests with coverage instrumentation
        run: cargo llvm-cov --no-report nextest --verbose
      - name: Run doc tests
        run: cargo test --doc --verbose
      - name: Export unit test coverage
        # `--output-path` does not create missing parent directories.
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report --lcov --output-path target/coverage/unit.lcov
      - name: Upload unit test coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov-unit
          path: backend/target/coverage/unit.lcov
          retention-days: 3

  backend_integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Superuser: `#[sqlx::test]` creates one database per test.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The `query!` macros would otherwise check against this empty server
      # at compile time; the committed `.sqlx/` cache describes the schema.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Cache cargo-llvm-cov
        id: cache-llvm-cov
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-cargo-llvm-cov-v1
      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked
      - name: Cache cargo-nextest
        id: cache-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-cargo-nextest-v1
      - name: Install cargo-nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --locked
      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace
      # Integration binary only: the unit tests run in `backend_unit_tests`.
      - name: Run integration tests with coverage instrumentation
        run: cargo llvm-cov --no-report nextest --features integration --test integration
      - name: Export integration test coverage
        # `--output-path` does not create missing parent directories.
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report --lcov --output-path target/coverage/integration.lcov
      - name: Upload integration test coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov-integration
          path: backend/target/coverage/integration.lcov
          retention-days: 3

  backend_coverage:
    name: Backend Coverage
    runs-on: ubuntu-latest
    needs: [backend_unit_tests, backend_integration]
    defaults:
      run:
        working-directory: backend
    env:
      # Measured line coverage (unit + integration, lcov count) rounded down to the nearest 5 %.
      COVERAGE_MIN_LINES: "90"
    steps:
      # genhtml reads the sources; the lcov paths match this checkout's location.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install lcov
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lcov
      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-lcov-*
          path: backend/target/coverage
          merge-multiple: true
      - name: Merge unit and integration coverage
        run: |
          lcov -a target/coverage/unit.lcov -a target/coverage/integration.lcov \
            -o target/coverage/merged.lcov
      - name: Enforce the line coverage threshold
        run: |
          lines_percent=$(lcov --summary target/coverage/merged.lcov 2>&1 \
            | awk '/lines\.+:/ { sub("%", "", $2); print $2 }')
          echo "Line coverage: ${lines_percent}% (minimum ${COVERAGE_MIN_LINES}%)"
          awk -v actual="$lines_percent" -v minimum="$COVERAGE_MIN_LINES" \
            'BEGIN { exit !(actual != "" && actual + 0 >= minimum + 0) }' \
            || { echo "::error::Line coverage ${lines_percent:-unknown}% is below ${COVERAGE_MIN_LINES}%"; exit 1; }
      - name: Generate HTML coverage report
        if: ${{ !cancelled() }}
        run: genhtml target/coverage/merged.lcov --output-directory target/coverage/html
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-backend
          path: backend/target/coverage/html/
          retention-days: 3

  backend_openapi:
    name: Backend OpenAPI Drift Check
    runs-on: ubuntu-latest
    needs: [backend_build]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # No database or HTTP server involved — the schema is collected purely
      # from route annotations (see route::openapi_spec / src/bin/gen_openapi.rs).
      - name: Generate OpenAPI spec
        run: cargo run --bin gen_openapi -- /tmp/openapi-fresh.json
      - name: Check OpenAPI drift
        run: |
          if [ -f ../frontend/docs-frontend/openapi.json ]; then
            jq --sort-keys . ../frontend/docs-frontend/openapi.json > /tmp/expected.json
            jq --sort-keys . /tmp/openapi-fresh.json > /tmp/actual.json
            if ! diff -u /tmp/expected.json /tmp/actual.json; then
              echo "::error::docs/openapi.json est désynchronisé — lancer 'cargo run --bin gen_openapi -- ../frontend/docs-frontend/openapi.json' dans backend/ et committer le fichier."
              exit 1
            fi
            echo "OpenAPI spec à jour."
          else
            echo "::warning::docs/openapi.json introuvable — committer le fichier généré pour activer la détection de dérive."
            cp /tmp/openapi-fresh.json ../frontend/docs-frontend/openapi.json
          fi
      - name: Upload generated OpenAPI spec
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-spec
          path: /tmp/openapi-fresh.json
          retention-days: 7

  backend_docker:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs: [backend_fmt, backend_clippy, backend_coverage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: runtime
          push: false
          tags: myhouse-backend:ci
