name: CI Frontend

on:
  pull_request:
    branches: ["develop"]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · type-check · build · docker build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: myhouse
          POSTGRES_PASSWORD: myhouse
          POSTGRES_DB: myhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myhouse -d myhouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only dummy values — never used outside this ephemeral runner.
      APP_PORT: "3000"
      APP_ENV: development
      DATABASE_URL: postgresql://myhouse:myhouse@localhost:5432/myhouse
      JWT_SECRET: ci-dummy-jwt-secret-value-not-a-real-secret-32b
      JWT_ACCESS_TTL_SECONDS: "900"
      JWT_REFRESH_TTL_DAYS: "30"
      OTP_TTL_SECONDS: "600"
      OTP_MAX_ATTEMPTS: "3"
      OTP_RATE_LIMIT_SECONDS: "60"
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /tmp/myhouse-storage
      PUBLIC_MEDIA_BASE_URL: http://localhost/media
      COOKIE_DOMAIN: localhost
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@myhouse.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # A debug build of the backend is run only to serve its live OpenAPI
      # schema for type generation below — not the artifact under test
      # (backend correctness is covered by ci-backend.yml).
      - name: Build backend
        run: cargo build --manifest-path backend/Cargo.toml

      - name: Start backend in the background
        run: |
          mkdir -p "$LOCAL_STORAGE_PATH"
          ./backend/target/debug/backend-my-house &
          echo $! > backend.pid

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${APP_PORT}/health" > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy in time" >&2
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Generates src/shared/api/types.ts from the backend's live OpenAPI
      # schema — the single source of truth for the frontend's API contract.
      - name: Generate types from live OpenAPI schema
        working-directory: frontend
        run: npm run generate:types

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Stop backend
        if: always()
        run: kill "$(cat backend.pid)" || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Relies on src/shared/api/types.ts already generated above — the
      # image build itself never talks to a live backend (see frontend/Dockerfile).
      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runtime
          push: false
          tags: myhouse-frontend:ci
