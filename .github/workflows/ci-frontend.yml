name: CI Frontend

on:
  pull_request:
    branches: ["develop"]
    paths:
      - "frontend/**"
      - "docs/openapi.json"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend_install:
    name: Frontend Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}

  frontend_codegen:
    name: Frontend OpenAPI Codegen
    runs-on: ubuntu-latest
    needs: [frontend_install]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
      - name: Generate TypeScript types from OpenAPI spec
        run: npm run generate:types:ci
        working-directory: frontend
      - name: Cache generated types
        uses: actions/cache@v4
        with:
          path: frontend/src/shared/api/types.ts
          key: openapi-types-${{ github.sha }}

  frontend_lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    needs: [frontend_install, frontend_codegen]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore generated types
        uses: actions/cache@v4
        with:
          path: frontend/src/shared/api/types.ts
          key: openapi-types-${{ github.sha }}
      - name: ESLint
        run: npm run lint
        working-directory: frontend

  frontend_prettier:
    name: Frontend Prettier
    runs-on: ubuntu-latest
    needs: [frontend_install, frontend_codegen]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore generated types
        uses: actions/cache@v4
        with:
          path: frontend/src/shared/api/types.ts
          key: openapi-types-${{ github.sha }}
      - name: Prettier
        run: npm run prettier:check
        working-directory: frontend

  frontend_typescript:
    name: Frontend TypeScript
    runs-on: ubuntu-latest
    needs: [frontend_install, frontend_codegen]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore generated types
        uses: actions/cache@v4
        with:
          path: frontend/src/shared/api/types.ts
          key: openapi-types-${{ github.sha }}
      - name: TypeScript check
        run: npm run ts:check
        working-directory: frontend

  frontend_build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend_install, frontend_codegen]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore generated types
        uses: actions/cache@v4
        with:
          path: frontend/src/shared/api/types.ts
          key: openapi-types-${{ github.sha }}
      - name: Build
        run: npm run build
        working-directory: frontend

  frontend_docker:
    name: Frontend Docker Build
    runs-on: ubuntu-latest
    needs: [frontend_build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
      - name: Restore generated types
        uses: actions/cache@v4
        with:
          path: frontend/src/shared/api/types.ts
          key: openapi-types-${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runtime
          push: false
          tags: myhouse-frontend:ci
