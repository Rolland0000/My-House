# Updates the SHA-pinned actions and digest-pinned images: one grouped PR per
# ecosystem each month.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: monthly
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      compose-images:
        patterns: ["*"]
