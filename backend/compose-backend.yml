services:
  # ── dev — hot-reload: source bind-mounted, cargo-watch ────────────────────────
  backend-dev:
    profiles: ["dev"]
    container_name: mh-backend-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Overrides env_file: inside the compose network the DB is reachable at
      # the "db" service hostname, not "localhost" (which backend/.env
      # correctly uses for a bare `cargo run` on the host instead). Built from
      # the same POSTGRES_* vars as the db service so credentials can
      # never drift out of sync between the two services.
      DATABASE_URL: postgresql://${POSTGRES_USER:? Set POSTGRES_USER in .env or environment}:${POSTGRES_PASSWORD:? Set POSTGRES_PASSWORD in .env or environment}@db:5432/${POSTGRES_DB:? Set POSTGRES_DB in .env or environment}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0:3000"
    volumes:
      - ./:/app
      - backend_cargo_registry:/usr/local/cargo/registry
      - backend_target:/app/target
      - storage_data:/app/storage

  # ── prod — built image: release binary ─────────────────────────────────────────
  backend-prod:
    profiles: ["prod"]
    container_name: mh-backend-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      # See backend-dev — same reasoning, "db" not "localhost", and
      # built from POSTGRES_* so credentials can't drift out of sync.
      DATABASE_URL: postgresql://${POSTGRES_USER:? Set POSTGRES_USER in .env or environment}:${POSTGRES_PASSWORD:? Set POSTGRES_PASSWORD in .env or environment}@db:5432/${POSTGRES_DB:? Set POSTGRES_DB in .env or environment}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - storage_data:/app/storage

volumes:
  backend_cargo_registry:
  backend_target:
