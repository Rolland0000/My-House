[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]

[bans]
version = 2
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
version = 2
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
