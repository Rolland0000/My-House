[package]
name = "backend-my-house"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "macros"] }
utoipa = "5.5"
# Pinned to 0.1.x: 0.2+ requires axum 0.8, this project is locked to axum 0.7.
utoipa-axum = "0.1.3"
# Capped below 8.1.1/9.x: those require axum 0.8, this project is locked to axum 0.7.
utoipa-swagger-ui = { version = ">=8.0.3, <8.1.1", features = ["axum"] }

[dev-dependencies]