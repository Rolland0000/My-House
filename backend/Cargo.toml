[package]
name = "backend-my-house"
version = "0.1.0"
edition = "2021"
publish = false
# `cargo run`/`cargo watch -x run` (dev Docker CMD) would otherwise be
# ambiguous now that `src/bin/gen_openapi.rs` adds a second binary.
default-run = "backend-my-house"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "macros", "uuid"] }
utoipa = { version = "5.5", features = ["uuid"] }
utoipa-axum = "0.1.3"
utoipa-swagger-ui = { version = ">=8.0.3, <8.1.1", features = ["axum"] }

[dev-dependencies]