[package]
name = "backend-my-house"
version = "0.1.0"
edition = "2021"
publish = false
# `cargo run`/`cargo watch -x run` (dev Docker CMD) would otherwise be
# ambiguous now that `src/bin/gen_openapi.rs` adds a second binary.
default-run = "backend-my-house"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service", "server-graceful"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "macros", "uuid", "json"] }
utoipa = { version = "6", features = ["uuid"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
async-trait = "0.1"
bytes = "1"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
askama = "0.14"
moka = { version = "0.12", features = ["future"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
sha2 = "0.10"
axum-extra = { version = "0.12", features = ["cookie", "query"] }
time = "0.3"
rand = "0.8"
ipnet = "2.12.1"
infer = "0.22"
argon2 = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }


[dev-dependencies]
