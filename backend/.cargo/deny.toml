[advisories]
version = 2
ignore = [
    # No fixed upgrade available yet (transitive via sqlx-mysql, not reachable
    # at runtime since only the "postgres" sqlx feature is enabled).
    "RUSTSEC-2023-0071",
    # `paste` (via utoipa-axum) is archived/unmaintained with no safe
    # replacement drop-in yet; revisit when utoipa-axum drops the dependency.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]

allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
