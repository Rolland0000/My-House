include:
  - backend/compose-backend.yml
  - frontend/compose-frontend.yml

services:
  adminer:
    profiles: ["dev"]
    image: adminer
    container_name: mh-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    container_name: mh-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:? Set POSTGRES_USER in .env or environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:? Set POSTGRES_PASSWORD in .env or environment}
      POSTGRES_DB: ${POSTGRES_DB:? Set POSTGRES_DB in .env or environment}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  storage_data:
