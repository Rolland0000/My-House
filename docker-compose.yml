version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: location_db
    environment:
      POSTGRES_USER: location_user
      POSTGRES_PASSWORD: location_pass
      POSTGRES_DB: location_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U location_user -d location_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - location_network

  # Backend API (Rust + Axum)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: location_backend
    environment:
      DATABASE_URL: postgres://location_user:location_pass@postgres:5432/location_db
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRATION: 3600
      PORT: 8000
      RUST_LOG: debug
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - location_network
    restart: unless-stopped

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: location_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - location_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  location_network:
    driver: bridge