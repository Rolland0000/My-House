server {
    # Unprivileged port: the image runs nginx as a non-root user.
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Keep these at server level: a location with its own `add_header` drops them.
    # Browsers ignore HSTS over plain HTTP; it applies once a TLS proxy is in front.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Backend API — proxied so the browser only ever talks to one origin.
    location /api/ {
        # Fits the largest backend limit (owner request, two 5 MiB documents).
        # The backend still enforces each route's own limit.
        client_max_body_size 11m;
        proxy_pass http://backend-prod:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check lives outside /api/v1 on the backend (see ARCHITECTURE.md §8.7).
    location /health {
        proxy_pass http://backend-prod:3000;
        proxy_set_header Host $host;
    }

    # Public media only, straight from the shared volume. The volume also holds
    # `owner-requests/*` (identity documents), so never alias its root.
    location /media/avatars/ {
        alias /usr/share/nginx/media/avatars/;
    }
    location /media/listings/ {
        alias /usr/share/nginx/media/listings/;
    }

    # React Router client-side routing — serve index.html for unknown paths.
    location / {
        try_files $uri /index.html;
    }
}
