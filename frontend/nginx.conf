server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API — proxied so the browser only ever talks to one origin.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check lives outside /api/v1 on the backend (see ARCHITECTURE.md §8.7).
    location /health {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # Public listing/avatar media — served directly from the shared storage
    # volume (read-only), never proxied back through the backend.
    location /media/ {
        alias /usr/share/nginx/media/;
    }

    # React Router client-side routing — serve index.html for unknown paths.
    location / {
        try_files $uri /index.html;
    }
}
