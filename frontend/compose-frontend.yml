services:
  # ── dev — hot-reload: source bind-mounted, vite dev server ────────────────────
  frontend-dev:
    profiles: ["dev"]
    container_name: mh-frontend-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      # generate:types (run via the `predev` hook) fetches the OpenAPI schema
      # from this host:port instead of localhost — inside the compose network
      # the backend is only reachable at its service name.
      API_HOST: backend-dev
      APP_PORT: "3000"
    depends_on:
      backend-dev:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules

  # ── prod — built image: static assets served by nginx ─────────────────────────
  frontend-prod:
    profiles: ["prod"]
    container_name: mh-frontend-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      backend-prod:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - storage_data:/usr/share/nginx/media:ro

volumes:
  frontend_node_modules:
